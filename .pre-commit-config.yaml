repos:
- hooks:
  - id: commitizen
  - id: commitizen-branch
    stages:
    - pre-push
  repo: https://github.com/commitizen-tools/commitizen
  rev: v4.8.3
- hooks:
  - id: trailing-whitespace
    args:
    - --markdown-linebreak-ext=md
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
